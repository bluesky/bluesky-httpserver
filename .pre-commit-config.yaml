default_language_version:
    python: python3
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff
        name: lint with ruff
        language: system
        entry: ruff check --force-exclude --fix
        types: [python]
        require_serial: true

      - id: ruff-format
        name: format with ruff
        language: system
        entry: ruff format --force-exclude
        types: [python]
        require_serial: true

      - id: pyright
        name: type check with pyright
        language: system
        # No paths: command-line paths replace [tool.pyright] include in pyproject.toml.
        entry: pyright
        pass_filenames: false
        files: ^src/bluesky_httpserver/v2/
        types: [python]
        require_serial: true
