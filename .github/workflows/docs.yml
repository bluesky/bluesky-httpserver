name: Documentation

on: [push, pull_request]

jobs:
  build:

    name: Test building docs

    runs-on: ubuntu-latest

    env:
      python_env: py313

    strategy:
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          # Need this to get version number from last tag
          fetch-depth: 0

      - uses: shogo82148/actions-setup-redis@v1
        with:
          redis-version: "7.x"

      - uses: prefix-dev/setup-pixi@v0.10.0

      - name: Install dev dependencies
        run: |
          set -vxeuo pipefail
          pixi install --environment=${{ env.python_env }}
          pixi run --environment=${{ env.python_env }} pip install "git+https://github.com/bluesky/bluesky-queueserver.git@main"
          pixi run --environment=${{ env.python_env }} pip install "git+https://github.com/bluesky/bluesky-queueserver-api.git@main"

          pixi list --environment=${{ env.python_env }}
          pixi run --environment=${{ env.python_env }} pip list
          pixi run --environment=${{ env.python_env }} conda list

      - name: Run pre-commit
        run: |
          pixi run --environment=${{ env.python_env }} make -C docs/ html
